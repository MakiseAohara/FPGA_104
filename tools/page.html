<!doctype html>
<meta charset="utf-8">
<title>MMT 实时监控</title>
<style>
body{background:#111;color:#ddd;font:14px/1.5 Consolas,monospace;margin:16px}
.box{border:1px solid #333;padding:10px;margin-bottom:10px;border-radius:6px}
img{image-rendering:pixelated;border:1px solid #333;width:384px}
.alarm{color:#f55;font-weight:bold}.ok{color:#5f5}.lp{color:#fc5}
table{border-collapse:collapse}td{padding:2px 10px}
.ev{cursor:pointer;padding:2px 0}
.ev:hover{color:#fff}
.thumb{width:192px;margin-top:4px;display:none}
.warn{color:#fc5}
#modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center}
#modal img{width:auto;max-width:80vw;max-height:80vh}
</style>
<body>
<h2>MMT 多模态终端 · 实时监控</h2>
<div class="box"><img id="fr" src="/frame.png"><div id="st">...</div></div>
<div class="box"><b>统计</b><div id="sm"></div></div>
<div class="box"><b>最近事件</b>（点击展开缩略图）<div id="ev"></div></div>
<div id="modal"><img id="mimg" src=""></div>
<script>
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function openThumb(src){const m=document.getElementById('modal');document.getElementById('mimg').src=src;m.style.display='flex';}
document.getElementById('modal').onclick=function(){this.style.display='none';};

async function tick(){
 try{
  const r=await fetch("/api/status");
  const j=await r.json();
  document.getElementById("st").innerHTML=
   "帧 "+j.f+" · p="+j.p+" · person="+j.person+" · motion="+j.motion+" · area="+j.area+
   "<br>ALARM "+(j.alarm?"<span class=alarm>ON</span>":"<span class=ok>off</span>")+
   " · LOWPWR "+(j.lowpwr?"<span class=lp>ON</span>":"off")+
   " · camfps="+j.camfps+" · inf_hz="+j.inf_hz+
   "<br>温度 "+j.sht+" · 湿度 "+j.rh+" · 体表 "+j.body;
  document.getElementById("fr").src="/frame.png?t="+Date.now();

  const sm=await (await fetch("/api/summary")).json();
  document.getElementById("sm").innerHTML="统计自 "+sm.started+"：帧 "+sm.frames+
   " · 有人帧 "+sm.person+" ("+sm.person_pct+"%) · 运动帧 "+sm.motion+" ("+sm.motion_pct+"%)<br>报警起报 "+
   sm.alarm_starts+" 次 · 低功耗帧 "+sm.lp+" ("+sm.lp_pct+"%)"+
   (sm.udp_events!==undefined?" · UDP 事件 "+sm.udp_events+" 次 · 心跳 "+sm.udp_heartbeats+" 次":"")+
   (sm.thumb_incomplete?" · <span class=warn>缺片事件 "+sm.thumb_incomplete+"</span>":"");

  const e=await (await fetch("/api/events")).json();
  document.getElementById("ev").innerHTML=e.slice(-12).reverse().map(function(x){
    var t=(x.thumb?'<img class=thumb src="/thumb/'+esc(x.thumb)+'">':'');
    var inc=x.thumb_incomplete?' <span class=warn>[缩略图不全]</span>':'';
    var d=x.detail?(' <span style="color:#888">'+esc(JSON.stringify(x.detail))+'</span>'):'';
    return '<div class=ev onclick="var i=this.querySelector(\'img.thumb\'); if(i) i.style.display=(i.style.display==\'block\'?\'none\':\'block\');">'+
           esc(x.ts)+' '+esc(x.kind)+inc+d+t+'</div>';
  }).join("");
 }catch(e){}
 setTimeout(tick,700);
}
tick();
</script>
